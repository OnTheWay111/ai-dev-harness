name: P1 PostgreSQL gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: p1-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1-postgres:
    name: Migration, integration, build, and Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      POSTGRES_TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: prototype/web-ui/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: autodev/pyproject.toml
      - name: Install AutoDev from the root repository
        run: |
          python -m venv autodev/.venv
          autodev/.venv/bin/python -m pip install -e "./autodev[dev]"
      - name: Run AutoDev tests
        run: autodev/.venv/bin/python -m unittest discover -s autodev/tests -v
      - name: Install locked dependencies
        run: npm ci
        working-directory: prototype/web-ui
      - name: Install Chromium for the P5 review path
        run: npx playwright install --with-deps chromium
        working-directory: prototype/web-ui
      - name: Run the P1 PostgreSQL gate
        run: npm run ci:p1
        working-directory: prototype/web-ui
      - name: Run the P5 specification review browser path
        run: npm run test:browser:spec-review
        working-directory: prototype/web-ui
